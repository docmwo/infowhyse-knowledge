
name: Test WordPress Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Check WordPress REST API
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: github-publisher
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -euo pipefail

          response=$(curl --silent --show-error \
            --output /tmp/wp-response.json \
            --write-out "%{http_code}" \
            --user "$WP_USER:$WP_APP_PASSWORD" \
            "$WP_URL/wp-json/wp/v2/users/me")

          if [ "$response" = "200" ]; then
            echo "WordPress connection successful!"
          else
            echo "WordPress connection failed (HTTP $response)"
            echo "Response content type:"
            file --mime-type /tmp/wp-response.json
            echo "Response preview:"
            head -c 500 /tmp/wp-response.json
            echo
            exit 1
          fi
