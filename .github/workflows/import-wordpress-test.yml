
name: Test WordPress Import

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Markdown and YAML converters
        run: python -m pip install markdown PyYAML

      - name: Import one article as draft
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER: github-publisher
        run: python scripts/import_wordpress.py
