
name: Test WordPress Import

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Markdown and YAML converters
        run: python -m pip install markdown PyYAML

      - name: Import one article as draft
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER: github-publisher
        run: python scripts/import_wordpress.py

      - name: Check Yoast REST API fields
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER: github-publisher
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = os.environ["WP_URL"].rstrip("/")
          credentials = (
              f'{os.environ["WP_USER"]}:'
              f'{os.environ["WP_APP_PASSWORD"]}'
          )
          auth = base64.b64encode(
              credentials.encode()
          ).decode()

          request = urllib.request.Request(
              f"{url}/wp-json/wp/v2/types/wissen"
              "?context=edit",
              headers={
                  "Authorization": f"Basic {auth}",
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              data = json.load(response)

          print("REST API accessible:", data["slug"])

          print(
              "Yoast fields require a separate "
              "authenticated metadata test."
          )
          PY
